{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluations | InternTrack</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .sidebar-gradient {
            background: linear-gradient(180deg, #003366 0%, #0059b3 100%);
        }

        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>

<body class="font-inter bg-gray-50 h-full">
    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar -->
        <div
            class="sidebar-gradient text-white w-64 md:w-20 lg:w-64 flex-shrink-0 transition-all duration-300 ease-in-out">

            <div class="p-4 flex items-center justify-between border-b border-blue-800">
                <h1 class="text-xl font-bold hidden md:block lg:block">InternTrack</h1>
                <i data-feather="menu" class="md:block lg:hidden cursor-pointer"></i>
            </div>

            <nav class="mt-6">
                <div class="px-4 py-3 flex items-center hover:bg-blue-700 transition-colors duration-200">
                    <i data-feather="home" class="w-5 h-5"></i>
                    <a href="{% url 'dashboard' %}" class="ml-3 hidden md:hidden lg:block">Dashboard</a>
                </div>

                <div class="px-4 py-3 flex items-center hover:bg-blue-700 transition-colors duration-200">
                    <i data-feather="users" class="w-5 h-5"></i>
                    <a href="{% url 'manage_interns' %}" class="ml-3 hidden md:hidden lg:block">Manage Interns</a>
                </div>

                <div class="px-4 py-3 flex items-center hover:bg-blue-700 transition-colors duration-200">
                    <i data-feather="calendar" class="w-5 h-5"></i>
                    <a href="{% url 'attendance_records' %}" class="ml-3 hidden md:hidden lg:block">Attendance
                        Records</a>
                </div>

                <div class="px-4 py-3 flex items-center bg-blue-800 transition-colors duration-200">
                    <i data-feather="check-circle" class="w-5 h-5"></i>
                    <a href="{% url 'evaluations' %}"
                        class="ml-3 hidden md:hidden lg:block font-semibold">Evaluations</a>
                </div>

                <div class="px-4 py-3 flex items-center hover:bg-blue-700 transition-colors duration-200">
                    <i data-feather="file-text" class="w-5 h-5"></i>
                    <a href="{% url 'reports' %}" class="ml-3 hidden md:hidden lg:block">Reports</a>
                </div>

                <div class="px-4 py-3 flex items-center hover:bg-blue-700 transition-colors duration-200">
                    <i data-feather="settings" class="w-5 h-5"></i>
                    <a href="{% url 'admin-profile' %}" class="ml-3 hidden md:hidden lg:block">Settings</a>
                </div>

                <div
                    class="absolute bottom-0 w-full px-4 py-3 flex items-center hover:bg-blue-700 transition-colors duration-200">
                    <i data-feather="log-out" class="w-5 h-5"></i>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="ml-3 hidden md:hidden lg:block">Logout</button>
                    </form>
                </div>

            </nav>
        </div>

        <!-- Main Content -->
        <main class="flex-1 p-6 overflow-auto">

            <h2 class="text-2xl font-semibold text-gray-800 mb-6">Intern Evaluations</h2>

            <!-- Intern Table -->
            <div class="bg-white shadow-md rounded-lg p-4">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">
                                Name
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">
                                Program
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">
                                Action
                            </th>
                        </tr>
                    </thead>

                    <tbody id="intern-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Filled by JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Evaluation Modal -->
            <div id="evalModal"
                class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                <div class="bg-white rounded-lg shadow-lg max-w-3xl w-full mx-4 max-h-[90vh] overflow-y-auto">
                    <div class="flex justify-between items-center p-6 border-b border-gray-200">
                        <h2 id="evalModalTitle" class="text-2xl font-bold">Evaluate Intern</h2>
                        <button id="evalClose" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
                    </div>
                    <form id="evalForm" class="p-6 space-y-4">
                        <input type="hidden" name="student_id" id="evalStudentId">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <p class="font-medium">Intern</p>
                                <p id="evalStudentName" class="text-gray-600"></p>
                            </div>
                            <div>
                                <p class="font-medium">Program</p>
                                <p id="evalStudentProgram" class="text-gray-600"></p>
                            </div>
                        </div>

                        <!-- Questions: generated by JS into this container -->
                        <div id="questionsContainer" class="grid grid-cols-1 gap-3"></div>

                        <div>
                            <label class="font-medium">What is one area the intern could improve in for future roles?
                                (optional)</label>
                            <textarea id="evalRemarks" name="remarks"
                                placeholder="e.g. time management, technical skills, communication"
                                class="w-full border rounded p-2 mt-1" rows="4"></textarea>
                        </div>

                        <div class="flex justify-end space-x-3">
                            <button type="button" id="evalCancel" class="px-4 py-2 bg-gray-200 rounded">Cancel</button>
                            <button type="submit" id="evalSubmit"
                                class="px-4 py-2 bg-blue-600 text-white rounded">Submit Evaluation</button>
                        </div>
                    </form>
                </div>
            </div>

        </main>
    </div>

    <script>
        feather.replace();

        // Load intern list from DRF API
        fetch("/api/evaluations/")     // <-- change path to match your API URL
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById("intern-table-body");

                data.interns.forEach(intern => {
                    const row = document.createElement('tr');
                    const evaluatedBadge = intern.evaluated ? `<span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">Evaluated</span>` : '';
                    let btnHtml = '';
                    if (intern.evaluated) {
                        btnHtml = `<button onclick="openEvalDetailModal(${intern.eval_id})" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">View</button>`;
                    } else {
                        btnHtml = `<button data-id="${intern.id}" data-name="${intern.full_name}" data-program="${intern.program}" class="evaluateBtn px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Evaluate</button>`;
                    }

                    row.innerHTML = `
                        <td class="px-6 py-4 text-gray-700">${intern.full_name} ${evaluatedBadge}</td>
                        <td class="px-6 py-4 text-gray-700">${intern.program}</td>
                        <td class="px-6 py-4">${btnHtml}</td>
                    `;
                    tbody.appendChild(row);
                });

                // Attach click handlers for evaluate buttons
                document.querySelectorAll('.evaluateBtn').forEach(btn => {
                    btn.addEventListener('click', function (e) {
                        const id = this.dataset.id;
                        const name = this.dataset.name;
                        const program = this.dataset.program;
                        openEvalModal(id, name, program);
                    });
                });
            });

        // Utility: get csrf token from cookie
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    // Does this cookie string begin with the name we want?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Modal and form logic
        const evalModal = document.getElementById('evalModal');
        const evalClose = document.getElementById('evalClose');
        const evalCancel = document.getElementById('evalCancel');
        const evalForm = document.getElementById('evalForm');
        const questionsContainer = document.getElementById('questionsContainer');

        function openEvalModal(id, name, program) {
            document.getElementById('evalStudentId').value = id;
            document.getElementById('evalStudentName').textContent = name;
            document.getElementById('evalStudentProgram').textContent = program;
            // build questions
            questionsContainer.innerHTML = '';

            // Questionnaire: render as 5-point Likert scale (1..5)
            // We'll use values 1 (Strongly Disagree) .. 5 (Strongly Agree)
            const likertAnchors = ['Strongly Disagree', 'Disagree', 'Neutral', 'Agree', 'Strongly Agree'];

            const questions = [
                { key: 'q1', text: 'How effectively did the intern complete their tasks and meet deadlines?' },
                { key: 'q2', text: 'Did the intern demonstrate a clear understanding of their responsibilities?' },
                { key: 'q3', text: "How would you rate the intern's technical skills relevant to the role?" },
                { key: 'q4', text: 'Did the intern show improvement in their skills during the internship?' },
                { key: 'q5', text: 'How well did the intern communicate with team members and supervisors?' },
                { key: 'q6', text: 'Did the intern contribute ideas or suggestions during team discussions?' },
                { key: 'q7', text: 'Did the intern show a willingness to learn new skills and tasks?' },
                { key: 'q8', text: 'How well did the intern take feedback and apply it to improve their work?' },
                { key: 'q9', text: 'How satisfied are you with the intern’s overall performance?' }
            ];

            // Render Likert grid for each question
            questions.forEach((q) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'p-3 border rounded bg-white';

                const label = document.createElement('div');
                label.className = 'mb-2 text-sm font-medium text-gray-800';
                label.textContent = q.text;
                wrapper.appendChild(label);

                const grid = document.createElement('div');
                grid.className = 'flex items-center justify-between gap-2 text-center';

                // Add 5 radio buttons (1..5)
                for (let i = 1; i <= 5; i++) {
                    const item = document.createElement('div');
                    item.className = 'flex-1';

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = q.key;
                    input.value = String(i);
                    input.id = `${q.key}_${i}`;
                    input.className = 'peer sr-only';
                    input.required = true;

                    const labelFor = document.createElement('label');
                    labelFor.htmlFor = input.id;
                    labelFor.className = 'block cursor-pointer select-none p-2 rounded border peer-checked:bg-blue-600 peer-checked:text-white peer-checked:font-semibold';
                    labelFor.innerHTML = `<div class="text-sm">${i}</div><div class="text-xs text-gray-500">${likertAnchors[i - 1]}</div>`;

                    item.appendChild(input);
                    item.appendChild(labelFor);
                    grid.appendChild(item);
                }

                wrapper.appendChild(grid);
                questionsContainer.appendChild(wrapper);
            });

            evalModal.classList.remove('hidden');
            window.scrollTo({ top: 0 });
        }

        function closeEvalModal() {
            evalModal.classList.add('hidden');
        }

        if (evalClose) evalClose.addEventListener('click', closeEvalModal);
        if (evalCancel) evalCancel.addEventListener('click', closeEvalModal);

        // Click outside to close
        if (evalModal) {
            evalModal.addEventListener('click', function (e) {
                if (e.target === evalModal) closeEvalModal();
            });
        }

        evalForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const formData = new FormData(evalForm);
            const payload = {};
            for (const [k, v] of formData.entries()) {
                payload[k] = v;
            }

            // POST to API
            fetch('/api/evaluations/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify(payload)
            }).then(r => r.json())
                .then(resp => {
                    if (resp && resp.message) {
                        const studentId = payload.student_id;
                        document.querySelectorAll(`[data-id='${studentId}']`).forEach(el => {
                            if (el.classList.contains('evaluateBtn')) {
                                el.disabled = true;
                                el.classList.remove('bg-blue-600');
                                el.classList.add('bg-gray-300');
                                el.textContent = 'Evaluated';
                            }
                        });
                        const evalCountEl = document.getElementById('evalCount');
                        if (evalCountEl) {
                            const current = parseInt(evalCountEl.textContent || '0');
                            evalCountEl.textContent = current + 1;
                        }
                        const overviewList = document.getElementById('evaluationOverviewList');
                        if (overviewList) {
                            const newItem = document.createElement('div');
                            newItem.className = 'flex items-center justify-between p-3 border-b border-gray-100';
                            const name = document.getElementById('evalStudentName').textContent;
                            const date = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                            newItem.innerHTML = `<div><p class="text-sm font-medium text-gray-900">${name}</p><p class="text-xs text-gray-500">Evaluated on ${date}</p></div><button onclick="openEvalDetailModal(${resp.evaluation_id})" class="text-blue-600 text-sm hover:underline bg-none border-none cursor-pointer">View</button>`;
                            overviewList.insertBefore(newItem, overviewList.firstChild);
                        }
                        alert('Evaluation saved');
                        closeEvalModal();
                    } else if (resp && resp.error) {
                        alert('Error: ' + resp.error);
                    }
                }).catch(err => {
                    console.error(err);
                    alert('Error saving evaluation');
                });
        });

        // Evaluation detail modal function for viewing evaluations
        function openEvalDetailModal(evalId) {
            let modal = document.getElementById('evalDetailModalAdmin');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'evalDetailModalAdmin';
                modal.className = 'hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
                modal.innerHTML = `
                    <div class="bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
                        <div class="flex justify-between items-center p-6 border-b border-gray-200">
                            <h2 class="text-2xl font-bold text-gray-800">Evaluation Details</h2>
                            <button onclick="document.getElementById('evalDetailModalAdmin').classList.add('hidden')" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
                        </div>
                        <div class="p-6 space-y-6">
                            <div class="pb-4 border-b">
                                <p class="text-sm text-gray-500">Evaluated Student</p>
                                <p id="detailStudentName" class="text-lg font-semibold text-gray-800">-</p>
                                <p id="detailProgram" class="text-sm text-gray-600">-</p>
                                <p id="detailDate" class="text-sm text-gray-500 mt-1">-</p>
                            </div>
                            <div>
                                <h3 class="font-semibold text-gray-800 mb-3">Evaluation Scores</h3>
                                <div id="detailScoresContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                            </div>
                            <div>
                                <h3 class="font-semibold text-gray-800 mb-2">Remarks</h3>
                                <p id="detailRemarks" class="text-gray-700 bg-gray-50 p-3 rounded">-</p>
                            </div>
                        </div>
                        <div class="p-6 border-t border-gray-200 flex justify-end">
                            <button onclick="document.getElementById('evalDetailModalAdmin').classList.add('hidden')" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded transition">Close</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
                modal.addEventListener('click', function (e) {
                    if (e.target === this) this.classList.add('hidden');
                });
            }
            fetch(`/api/evaluation/${evalId}/`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('detailStudentName').textContent = data.student_name;
                    document.getElementById('detailProgram').textContent = `Program: ${data.program}`;
                    document.getElementById('detailDate').textContent = `Evaluated: ${data.date_evaluated}`;
                    document.getElementById('detailRemarks').textContent = data.remarks;
                    const scoresContainer = document.getElementById('detailScoresContainer');
                    scoresContainer.innerHTML = '';
                    for (const [key, item] of Object.entries(data.scores)) {
                        const scoreDiv = document.createElement('div');
                        scoreDiv.className = 'p-3 bg-gray-50 rounded';
                        scoreDiv.innerHTML = `
                            <p class="text-sm text-gray-600 mb-1">${item.label}</p>
                            <p class="font-bold text-lg text-blue-600">${item.value || 'N/A'}</p>
                        `;
                        scoresContainer.appendChild(scoreDiv);
                    }
                    modal.classList.remove('hidden');
                })
                .catch(err => {
                    console.error(err);
                    alert('Error loading evaluation');
                });
        }
    </script>

</body>

</html>
